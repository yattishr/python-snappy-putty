[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snappy-putty"
version = "0.1.0"
description = "Suggestion-only CLI planner with safety-aware command guidance"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Snappy PuTTy Contributors" }
]
dependencies = [
  "openai-agents",
  "typer>=0.12",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
snappy_putty = "snappy_putty.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
